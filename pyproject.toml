[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-dialogue-mixer"
version = "1.0.0"
description = "Offline dialogue-aware WAV mixer with BS.1770 loudness and sample-aligned ducking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
offline-mixer = "offline_mixer.cli:main"

[tool.setuptools.packages.find]
include = ["offline_mixer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
