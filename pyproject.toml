[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-layered-softraster"
version = "0.1.0"
description = "Offline NumPy renderer for layered materials and per-light soft shadows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
softraster = "softraster.cli:main"

[tool.setuptools]
packages = ["softraster"]
