[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game-audio-variants"
version = "1.0.0"
description = "Deterministic loudness-normalized WAV variation generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "soundfile>=0.12",
]

[project.scripts]
game-audio-variants = "audio_variants.cli:main"

[tool.setuptools.packages.find]
include = ["audio_variants*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

