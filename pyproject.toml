[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutmaster"
version = "0.1.0"
description = "Deterministic offline dialogue/ambience/SFX timeline mastering CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
cutmaster = "cutmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
