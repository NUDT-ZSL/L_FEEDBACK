[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subalign"
version = "1.0.0"
description = "Detect and correct SRT/ASS subtitle timeline drift against a reference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pysubs2>=1.6",
]

[project.scripts]
subalign = "subalign.cli:main"

[tool.setuptools]
packages = ["subalign"]
