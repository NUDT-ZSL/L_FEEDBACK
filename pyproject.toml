[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-audio-mixer"
version = "1.0.0"
description = "Deterministic offline timeline audio mixer with FFmpeg encoding"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.scripts]
offline-audio-mixer = "audio_mixer.cli:main"

[tool.setuptools.packages.find]
include = ["audio_mixer*"]

