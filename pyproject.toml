[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-preview"
version = "1.0.0"
description = "Deterministic offscreen OpenGL character preview renderer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyOpenGL>=3.1.7",
  "Pillow>=10",
]

[project.scripts]
character-preview = "character_preview.cli:main"

[tool.setuptools.packages.find]
include = ["character_preview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

