[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialmix"
version = "1.0.0"
description = "Deterministic offline multichannel HRTF spatial audio mixer"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
]

[project.scripts]
spatialmix = "spatialmix.cli:main"

[tool.setuptools.packages.find]
include = ["spatialmix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

