[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopack"
version = "1.0.0"
description = "Deterministic offline WAV timeline packer with overlap, fades, looping and BS.1770 loudness normalization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
audiopack = "audiopack.cli:main"

[tool.setuptools]
packages = ["audiopack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
