[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventmix"
version = "1.0.0"
description = "Deterministic multitrack alignment and packaging for esports broadcast post-production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
eventmix = "eventmix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

