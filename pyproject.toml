[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemixer"
version = "1.0.0"
description = "Deterministic offline multi-track audio renderer for game cutscene localization"
requires-python = ">=3.10"
dependencies = ["numpy", "soxr"]

[project.scripts]
cinemixer = "cinemixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
