[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgen"
version = "1.0.0"
description = "Deterministic offline skill-audio variant generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
skillgen = "skillgen.cli:main"

[tool.setuptools.packages.find]
include = ["skillgen*"]
