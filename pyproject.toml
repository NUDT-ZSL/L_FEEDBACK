[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game-audio-mixer"
version = "1.0.0"
description = "Deterministic offline game-audio timeline mixer with EBU R128 loudness normalization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "soundfile>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
game-audio-mixer = "game_audio_mixer.cli:main"

[tool.setuptools.packages.find]
include = ["game_audio_mixer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
