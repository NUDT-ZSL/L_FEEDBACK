[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfaudit"
version = "1.0.0"
description = "Deterministic PE/PDB attack-surface auditing for Windows binaries"
requires-python = ">=3.8"

[project.scripts]
cfaudit = "cfaudit.cli:main"

[tool.setuptools]
packages = ["cfaudit"]
