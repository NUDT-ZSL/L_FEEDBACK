[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutscene-dub"
version = "1.0.0"
description = "Deterministic multilingual cutscene dialogue conformance and stereo mixing CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cutscene-dub = "cutscene_dub.cli:main"

[tool.setuptools.packages.find]
include = ["cutscene_dub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

