[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-shot-mixer"
version = "1.0.0"
description = "Deterministic offline shot mixer for interactive stories"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[tool.setuptools.packages.find]
include = ["mixer*"]
