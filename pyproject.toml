[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-feedback-pipeline"
version = "1.0.0"
description = "Deterministic offline jitter-buffer, PLC, and FFmpeg transcode pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.scripts]
radio-pipeline = "radio_pipeline.cli:main"

[tool.setuptools]
packages = ["radio_pipeline"]

