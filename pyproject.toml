[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-mixer"
version = "1.0.0"
description = "Sample-accurate dialogue ducking and WSOLA time-stretch mixer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
dialogue-mixer = "dialogue_mixer.cli:main"

[tool.setuptools.packages.find]
include = ["dialogue_mixer*"]

