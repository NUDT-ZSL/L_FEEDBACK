[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-baker"
version = "1.0.0"
description = "Deterministic offline PBR material baker"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.scripts]
material-baker = "material_baker.cli:main"

[tool.setuptools.packages.find]
include = ["material_baker*"]

