[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-soft-renderer"
version = "1.0.0"
description = "Deterministic CPU-only layered soft rasterizer for indoor lighting reviews"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "Pillow>=8.0",
]

[project.scripts]
soft-render = "soft_renderer.cli:main"

[tool.setuptools]
packages = ["soft_renderer"]
