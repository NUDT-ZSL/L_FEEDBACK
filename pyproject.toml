[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-sync"
version = "1.0.0"
description = "Offline broadcast dialogue conform, loudness normalization, subtitle synchronization, and MKV packaging"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.scripts]
dialogue-sync = "dialogue_sync.cli:main"

[tool.setuptools.packages.find]
include = ["dialogue_sync*"]
